<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>법학 개념도 메이커</title>
<style>
  :root{
    --paper:#f7f3ea;
    --paper-2:#efe9da;
    --card:#fffdf8;
    --ink:#211c15;
    --ink-soft:#5a5141;
    --ink-faint:#8a7f6a;
    --line:#d8cfba;
    --line-soft:#e7dfcd;
    --seal:#9b1c1c;
    --gold:#b08900;
    --shadow:0 1px 2px rgba(40,30,10,.05),0 8px 24px rgba(40,30,10,.07);
    --shadow-lg:0 12px 40px rgba(40,30,10,.18);
    /* node type accents */
    --t-central:#2a2018;
    --t-definition:#0f766e;
    --t-statute:#b45309;
    --t-principle:#1d4ed8;
    --t-exception:#b91c1c;
    --t-case:#7c3aed;
    --t-example:#c2410c;
    --t-compare:#475569;
    --t-mnemonic:#be185d;
    --font-sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --font-mono:"JetBrains Mono","D2Coding","SFMono-Regular","SF Mono",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--font-sans);
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 12% -8%, #fffdf6 0%, rgba(255,255,255,0) 55%),
      radial-gradient(900px 500px at 105% 8%, #f3eedf 0%, rgba(255,255,255,0) 60%),
      var(--paper);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  body::before{ /* faint paper grain */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:radial-gradient(rgba(120,100,60,.05) 1px, transparent 1px);
    background-size:4px 4px;
  }

  /* ---------- top bar ---------- */
  header{
    position:sticky;top:0;z-index:30;
    background:rgba(247,243,234,.86);
    backdrop-filter:saturate(140%) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .bar{max-width:1400px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand .seal{
    font-family:var(--font-mono);font-weight:700;font-size:13px;letter-spacing:.5px;
    color:#fff;background:var(--seal);border-radius:6px;padding:3px 7px;white-space:nowrap;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);
  }
  .brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
  .brand small{color:var(--ink-faint);font-size:11px;font-family:var(--font-mono);letter-spacing:.3px}
  .meta-fields{display:flex;gap:8px;align-items:center;flex:1;min-width:220px}
  .meta-fields .fld{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
  .meta-fields label{font-size:10px;color:var(--ink-faint);font-weight:700;letter-spacing:.5px}
  .meta-fields input{border:none;background:transparent;font-family:var(--font-sans);font-size:13px;color:var(--ink);outline:none;width:13ch}
  .meta-fields input.topic{width:20ch;font-weight:700}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  button.btn{
    font-family:var(--font-sans);font-size:12.5px;font-weight:700;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;
    transition:.14s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  button.btn:hover{border-color:var(--seal);color:var(--seal);transform:translateY(-1px);box-shadow:var(--shadow)}
  button.btn .ic{font-family:var(--font-mono);font-weight:800}
  button.btn.primary{background:var(--ink);color:#fff8ee;border-color:var(--ink)}
  button.btn.primary:hover{background:var(--seal);border-color:var(--seal);color:#fff}
  button.btn.on{background:var(--seal);border-color:var(--seal);color:#fff}
  button.btn.on:hover{color:#fff}

  /* ---------- legend strip ---------- */
  .legend{max-width:1400px;margin:0 auto;padding:8px 18px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .legend .lab{font-size:10px;color:var(--ink-faint);font-weight:800;letter-spacing:.6px;margin-right:2px}
  .lg-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--line-soft);border-radius:999px;padding:3px 9px 3px 4px}
  .lg-chip .dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--font-mono);font-weight:800;font-size:11px}
  .savehint{font-size:11px;color:var(--t-definition);font-weight:700;margin-left:auto;display:inline-flex;gap:5px;align-items:center}

  /* ---------- canvas ---------- */
  #canvas{position:relative;z-index:1;width:100%;height:calc(100vh - 118px);overflow:auto;padding:34px 40px 120px}
  #stage{position:relative;display:inline-block;min-width:100%}
  svg#links{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:1}
  #tree{position:relative;z-index:2}

  /* recursive tree (left -> right) */
  .subtree{display:flex;align-items:center}
  .children{display:flex;flex-direction:column;gap:18px}
  .node-card{position:relative;margin-right:62px;width:262px;flex:0 0 auto;
    background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac,#999);
    border-radius:12px;padding:11px 12px 9px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .12s,box-shadow .12s,border-color .12s;
    animation:pop .26s ease both;animation-delay:var(--d,0s);
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .node-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--ac)}
  .node-card.is-central{width:280px;background:#2a2018;border-color:#2a2018;border-left:5px solid var(--gold);color:#f6ecd8}
  .node-card.is-central .type-tag{color:#d9c79b}
  .node-card.is-central .card-label{color:#fff7e9}
  .node-card.is-central .card-meta{color:#cdbb93;border-color:#5a4a30}
  .card-head{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .chip{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-family:var(--font-mono);font-weight:800;font-size:13px;flex:0 0 auto;background:var(--ac)}
  .type-tag{font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--ink-faint);text-transform:none}
  .head-sp{flex:1}
  .badges{display:flex;align-items:center;gap:4px;font-size:11px}
  .stars{color:var(--gold);letter-spacing:-1px;font-size:11px}
  .b-mem{font-size:10px}
  .b-m{font-family:var(--font-mono);font-weight:800;font-size:10px;color:#fff;background:var(--ink);border-radius:4px;padding:0 4px}
  .b-v{font-size:9.5px;font-weight:800;border-radius:5px;padding:1px 5px}
  .b-v.ok{color:#0f766e;background:#dcfce7}
  .b-v.no{color:#b45309;background:#fef3c7}
  .card-label{font-size:13.5px;font-weight:700;line-height:1.32;letter-spacing:-.2px;word-break:keep-all}
  .card-meta{display:inline-block;margin-top:5px;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);
    border:1px dashed var(--line);border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.4)}
  .card-foot{display:flex;align-items:center;gap:6px;margin-top:8px}
  .toggle{font-family:var(--font-mono);font-size:11px;font-weight:800;color:var(--ink-soft);
    background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:2px 7px;cursor:pointer}
  .toggle:hover{border-color:var(--ac);color:var(--ac)}
  .foot-sp{flex:1}
  .mini{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;font-family:var(--font-mono);font-weight:800;font-size:13px;color:var(--ink-soft);display:grid;place-items:center}
  .mini:hover{border-color:var(--seal);color:var(--seal)}
  .mini.add:hover{border-color:#0f766e;color:#0f766e}
  .detail-hint{font-size:10px;color:var(--ink-faint);margin-top:7px;display:flex;align-items:center;gap:4px}

  /* type accent assignment */
  .t-central{--ac:var(--t-central)} .t-definition{--ac:var(--t-definition)}
  .t-statute{--ac:var(--t-statute)} .t-principle{--ac:var(--t-principle)}
  .t-exception{--ac:var(--t-exception)} .t-case{--ac:var(--t-case)}
  .t-example{--ac:var(--t-example)} .t-compare{--ac:var(--t-compare)}
  .t-mnemonic{--ac:var(--t-mnemonic)}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;z-index:60;background:rgba(33,28,21,.42);backdrop-filter:blur(2px);
    display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:var(--paper);border:1px solid var(--line);border-radius:16px;max-width:620px;width:100%;
    box-shadow:var(--shadow-lg);overflow:hidden;animation:rise .2s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(var(--card),var(--paper))}
  .modal-head .chip{width:26px;height:26px;font-size:14px}
  .modal-head .mt{flex:1;min-width:0}
  .modal-head .ttag{font-size:11px;font-weight:800;color:var(--ink-faint)}
  .modal-head .mlabel{font-size:16px;font-weight:800;letter-spacing:-.3px;word-break:keep-all}
  .x{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;color:var(--ink-soft)}
  .x:hover{border-color:var(--seal);color:var(--seal)}
  .modal-body{padding:16px 18px;max-height:62vh;overflow:auto}
  .mmeta{font-family:var(--font-mono);font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;margin-bottom:12px;display:inline-block}
  .mdetail{white-space:pre-wrap;font-size:14px;line-height:1.62;color:var(--ink);word-break:keep-all}
  .mbadges{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* edit form */
  .field{margin-bottom:12px}
  .field>label{display:block;font-size:11px;font-weight:800;color:var(--ink-faint);letter-spacing:.4px;margin-bottom:5px}
  .field input[type=text],.field textarea,.field select{
    width:100%;font-family:var(--font-sans);font-size:14px;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
  .field input.mono,.field textarea.mono{font-family:var(--font-mono);font-size:13px}
  .field textarea{min-height:140px;resize:vertical;line-height:1.6}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--seal);box-shadow:0 0 0 3px rgba(155,28,28,.08)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .field{flex:1;min-width:130px}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);background:var(--card)}

  /* lists in modals (presets / help) */
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;margin-bottom:9px;transition:.13s}
  .opt:hover{border-color:var(--seal);transform:translateX(2px);box-shadow:var(--shadow)}
  .opt .ob{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-family:var(--font-mono);font-weight:800;flex:0 0 auto}
  .opt .ot{flex:1}
  .opt .ot b{display:block;font-size:14px}
  .opt .ot span{font-size:12px;color:var(--ink-faint)}

  .help h3{font-size:14px;margin:18px 0 8px;color:var(--seal);font-weight:800}
  .help h3:first-child{margin-top:2px}
  .help p,.help li{font-size:13.5px;line-height:1.62;color:var(--ink);word-break:keep-all}
  .help ul{margin:6px 0;padding-left:18px}
  .help code{font-family:var(--font-mono);font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .maptbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
  .maptbl th,.maptbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;word-break:keep-all}
  .maptbl th{background:var(--paper-2);font-weight:800;color:var(--ink-soft);white-space:nowrap}
  .maptbl td:first-child{font-weight:800;white-space:nowrap;color:var(--seal)}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink-soft)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .exarea{width:100%;min-height:300px;font-family:var(--font-mono);font-size:12px;line-height:1.5;
    border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);color:var(--ink);resize:vertical;outline:none}

  /* add-type popover */
  .pop{position:fixed;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow-lg);padding:7px;display:none;min-width:172px}
  .pop.open{display:block}
  .pop button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;
    border-radius:8px;padding:7px 9px;cursor:pointer;font-family:var(--font-sans);font-size:13px;color:var(--ink)}
  .pop button:hover{background:var(--card)}
  .pop .pc{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:var(--font-mono);font-weight:800;font-size:12px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:90;
    background:var(--ink);color:#fff8ee;font-size:13px;font-weight:700;padding:10px 16px;border-radius:10px;
    box-shadow:var(--shadow-lg);opacity:0;transition:.22s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    .brand h1{font-size:15px} .brand small{display:none}
    #canvas{padding:22px 16px 120px;height:calc(100vh - 150px)}
    .node-card{width:230px;margin-right:48px}
    .meta-fields{order:3;width:100%}
    .savehint{width:100%;margin:6px 0 0}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <span class="seal">法 MAP</span>
      <h1>법학 개념도 메이커</h1>
      <small>concept-map builder</small>
    </div>
    <div class="meta-fields">
      <div class="fld"><label>과목</label><input id="mSubject" type="text" value="민사소송법"></div>
      <div class="fld"><label>단원</label><input id="mTopic" class="topic" type="text" value="기판력의 시적 범위"></div>
    </div>
    <div class="tools">
      <button class="btn" id="btnEdit"><span class="ic">✎</span>편집모드</button>
      <button class="btn" id="btnPreset"><span class="ic">▦</span>과목 프리셋</button>
      <button class="btn" id="btnExport"><span class="ic">↧</span>내보내기</button>
      <button class="btn" id="btnImport"><span class="ic">↥</span>가져오기</button>
      <button class="btn" id="btnHelp"><span class="ic">?</span>도움말</button>
    </div>
  </div>
  <div class="legend" id="legend">
    <span class="lab">노드 문법</span>
    <span class="savehint">✓ 브라우저에 자동저장됨</span>
  </div>
</header>

<div id="canvas">
  <div id="stage">
    <svg id="links"></svg>
    <div id="tree"></div>
  </div>
</div>

<!-- detail / edit modal -->
<div class="overlay" id="ovDetail">
  <div class="modal" id="detailModal"></div>
</div>

<!-- preset modal -->
<div class="overlay" id="ovPreset">
  <div class="modal">
    <div class="modal-head"><span class="chip" style="background:var(--seal)">▦</span>
      <div class="mt"><div class="ttag">PRESET</div><div class="mlabel">개념도 불러오기</div></div>
      <button class="x" data-close>✕</button></div>
    <div class="modal-body" id="presetBody"></div>
  </div>
</div>

<!-- export modal -->
<div class="overlay" id="ovExport">
  <div class="modal">
    <div class="modal-head"><span class="chip" style="background:var(--ink)">↧</span>
      <div class="mt"><div class="ttag">EXPORT</div><div class="mlabel">내보내기</div></div>
      <button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <div class="tabs">
        <button class="tab on" id="tabJson">JSON (재불러오기용)</button>
        <button class="tab" id="tabMd">Markdown (정리 파일용)</button>
      </div>
      <textarea class="exarea" id="exArea" readonly></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnDownload"><span class="ic">⇩</span>파일로 저장</button>
      <button class="btn primary" id="btnCopy"><span class="ic">⧉</span>복사</button>
    </div>
  </div>
</div>

<!-- import modal -->
<div class="overlay" id="ovImport">
  <div class="modal">
    <div class="modal-head"><span class="chip" style="background:var(--ink)">↥</span>
      <div class="mt"><div class="ttag">IMPORT</div><div class="mlabel">가져오기 (JSON 붙여넣기)</div></div>
      <button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <p style="font-size:12.5px;color:var(--ink-faint);margin:0 0 10px">이전에 내보낸 JSON을 붙여넣으면 그대로 복원돼. (Markdown은 가져오기 안 됨)</p>
      <textarea class="exarea" id="imArea" placeholder='{ "meta": {...}, "root": {...} }'></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn primary" id="btnDoImport"><span class="ic">↥</span>불러오기</button>
    </div>
  </div>
</div>

<!-- help modal -->
<div class="overlay" id="ovHelp">
  <div class="modal">
    <div class="modal-head"><span class="chip" style="background:var(--seal)">?</span>
      <div class="mt"><div class="ttag">GUIDE</div><div class="mlabel">사용법 & 노드 문법</div></div>
      <button class="x" data-close>✕</button></div>
    <div class="modal-body help" id="helpBody"></div>
  </div>
</div>

<!-- add-type popover -->
<div class="pop" id="addPop"></div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------------- node-type grammar (the reusable core) ---------------- */
const TYPES = {
  central:   {name:"중심개념",  icon:"◎", md:"◎",   color:"var(--t-central)",   raw:"#2a2018"},
  definition:{name:"정의·기준", icon:"≣", md:"≣",   color:"var(--t-definition)",raw:"#0f766e"},
  statute:   {name:"조문",      icon:"§", md:"§ 📜", color:"var(--t-statute)",   raw:"#b45309"},
  principle: {name:"원칙·효과", icon:"⚖", md:"⚖",   color:"var(--t-principle)", raw:"#1d4ed8"},
  exception: {name:"예외·한계", icon:"⊘", md:"⊘",   color:"var(--t-exception)", raw:"#b91c1c"},
  case:      {name:"판례",      icon:"⚑", md:"⚑",   color:"var(--t-case)",      raw:"#7c3aed", verifiable:true},
  example:   {name:"사례·적용", icon:"✱", md:"💡",  color:"var(--t-example)",   raw:"#c2410c"},
  compare:   {name:"비교",      icon:"⇄", md:"⇄",   color:"var(--t-compare)",   raw:"#475569"},
  mnemonic:  {name:"두문자",    icon:"✦", md:"✦",   color:"var(--t-mnemonic)",  raw:"#be185d"}
};
const ADD_ORDER = ["definition","statute","principle","exception","case","example","compare","mnemonic"];

/* ---------------- id ---------------- */
let _id=0; const uid=()=>"n"+(++_id)+"_"+Math.random().toString(36).slice(2,6);
function reseed(node){ node.id=uid(); (node.children||[]).forEach(reseed); }

/* ---------------- escaping ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

/* ===================================================================
   WORKED EXAMPLE — 기판력의 시적 범위

const LS_KEY = "lawConceptMap_v1";
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({meta:state.meta,root:state.root})); }catch(e){} }
function loadState(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const o=JSON.parse(raw); if(o&&o.root&&o.root.type){ if(!o.meta)o.meta={subject:"",topic:""}; return o; } } }catch(e){} return null; }

/* ---------------- helpers to traverse ---------------- */
function findNode(id,node,parent){
  node=node||state.root;
  if(node.id===id) return {node,parent:parent||null};
  for(const c of (node.children||[])){const r=findNode(id,c,node); if(r) return r;}
  return null;
}

/* ---------------- tree render ---------------- */
function badgeHtml(n){
  let h="";
  if(n.importance>0){h+='<span class="stars">'+"★".repeat(Math.min(5,n.importance))+'</span>';}
  if(n.memo==="required") h+='<span class="b-mem" title="필수암기">🔴</span>';
  else if(n.memo==="recommended") h+='<span class="b-mem" title="권장암기">🟡</span>';
  if(n.m) h+='<span class="b-m">M</span>';
  if(TYPES[n.type].verifiable){
    if(n.verified===true) h+='<span class="b-v ok">✓검증</span>';
    else if(n.verified===false) h+='<span class="b-v no">⚠미검증</span>';
  }
  return h;
}
function cardHtml(n){
  const t=TYPES[n.type];
  const isC=n.type==="central";
  const kids=(n.children&&n.children.length)||0;
  let foot="";
  if(kids){
    foot+='<button class="toggle" data-toggle="'+n.id+'">'+(n.collapsed?("▸ "+kids):"▾")+'</button>';
  }
  foot+='<span class="foot-sp"></span>';
  if(editMode){
    foot+='<button class="mini add" data-add="'+n.id+'" title="자식 노드 추가">＋</button>';
    if(!isC) foot+='<button class="mini" data-del="'+n.id+'" title="삭제">✕</button>';
  }
  const metaLine = n.meta ? '<div class="card-meta">'+esc(n.meta)+'</div>' : '';
  const hint = (!editMode && n.detail) ? '<div class="detail-hint">▸ 눌러서 상세 보기</div>' : (editMode?'<div class="detail-hint">▸ 눌러서 편집</div>':'');
  return ''+
    '<div class="card-head">'+
      '<span class="chip">'+esc(t.icon)+'</span>'+
      '<span class="type-tag">'+esc(t.name)+'</span>'+
      '<span class="head-sp"></span>'+
      '<span class="badges">'+badgeHtml(n)+'</span>'+
    '</div>'+
    '<div class="card-label">'+esc(n.label)+'</div>'+
    metaLine+
    (foot?'<div class="card-foot">'+foot+'</div>':'')+
    hint;
}
let _delay=0;
function buildSubtree(n){
  const wrap=document.createElement("div");
  wrap.className="subtree";
  const card=document.createElement("div");
  card.className="node-card t-"+n.type+(n.type==="central"?" is-central":"");
  card.dataset.id=n.id;
  card.dataset.ntype=n.type;
  card.style.setProperty("--d",(_delay+=0.012)+"s");
  card.innerHTML=cardHtml(n);
  wrap.appendChild(card);
  if(n.children&&n.children.length&&!n.collapsed){
    const ch=document.createElement("div");
    ch.className="children";
    ch.dataset.parent=n.id;
    n.children.forEach(c=>ch.appendChild(buildSubtree(c)));
    wrap.appendChild(ch);
  }
  return wrap;
}
function render(){
  _delay=0;
  const tree=document.getElementById("tree");
  tree.innerHTML="";
  tree.appendChild(buildSubtree(state.root));
  document.getElementById("mSubject").value=state.meta.subject;
  document.getElementById("mTopic").value=state.meta.topic;
  requestAnimationFrame(drawLinks);
  saveState();
}

/* ---------------- connectors ---------------- */
function drawLinks(){
  const stage=document.getElementById("stage");
  const svg=document.getElementById("links");
  const sr=stage.getBoundingClientRect();
  const w=stage.offsetWidth, h=stage.offsetHeight;
  svg.setAttribute("width",w); svg.setAttribute("height",h);
  svg.setAttribute("viewBox","0 0 "+w+" "+h);
  let paths="";
  document.querySelectorAll(".children").forEach(ch=>{
    const pid=ch.dataset.parent;
    const pcard=document.querySelector('.node-card[data-id="'+pid+'"]');
    if(!pcard) return;
    const pr=pcard.getBoundingClientRect();
    const px=pr.right - sr.left, py=pr.top - sr.top + pr.height/2;
    // direct children = .subtree > .node-card
    Array.from(ch.children).forEach(sub=>{
      const ccard=sub.querySelector(":scope > .node-card");
      if(!ccard) return;
      const cr=ccard.getBoundingClientRect();
      const cx=cr.left - sr.left, cy=cr.top - sr.top + cr.height/2;
      const midX=px+(cx-px)/2;
      const acc=((TYPES[ccard.dataset.ntype]||{}).raw)||"#998";
      paths+='<path d="M '+px+' '+py+' L '+midX+' '+py+' L '+midX+' '+cy+' L '+cx+' '+cy+'" fill="none" stroke="'+acc.trim()+'" stroke-opacity="0.4" stroke-width="1.6"/>';
      paths+='<circle cx="'+px+'" cy="'+py+'" r="2.4" fill="'+acc.trim()+'" fill-opacity="0.6"/>';
    });
  });
  svg.innerHTML=paths;
}
window.addEventListener("resize",()=>requestAnimationFrame(drawLinks));

const ovExport=document.getElementById("ovExport");
function nodeToMd(n,depth,lines){
  const t=TYPES[n.type];
  const head="#".repeat(Math.min(6,depth+1));
  let badge="";
  if(n.importance>0) badge+=" "+"★".repeat(n.importance);
  if(n.memo==="required") badge+=" 🔴"; else if(n.memo==="recommended") badge+=" 🟡";
  if(n.m) badge+=" [M]";
  if(t.verifiable&&n.verified===true) badge+=" ✓검증";
  if(t.verifiable&&n.verified===false) badge+=" ⚠미검증";
  const metaTxt=n.meta?"  `"+n.meta+"`":"";
  lines.push(head+" "+t.md+" "+n.label+metaTxt+badge);
  if(n.detail&&n.detail.trim()){ lines.push(""); lines.push(n.detail.trim()); }
  lines.push("");
  (n.children||[]).forEach(c=>nodeToMd(c,depth+1,lines));
}
function toMarkdown(){
  const lines=[];
  lines.push("# "+state.meta.subject+" — "+state.meta.topic+" 개념도");
  lines.push("");
  nodeToMd(state.root,1,lines);
  lines.push("---");
  lines.push("> 법학 개념도 메이커로 생성. 판례번호·조문은 사용 전 원문 검증 권장.");
  return lines.join("\n");
}

  // normalise missing fields
  (function norm(n){ n.importance=n.importance||0; n.memo=n.memo||null; n.m=!!n.m;
    if(n.verified===undefined)n.verified=null; n.collapsed=!!n.collapsed; n.children=n.children||[];
    if(!TYPES[n.type]) n.type="definition"; n.children.forEach(norm); })(obj.root);
  state=obj; editMode=false;
  const eb=document.getElementById("btnEdit"); eb.classList.remove("on"); eb.innerHTML='<span class="ic">✎</span>편집모드';
  closeOverlays(); render(); toast("개념도 불러옴");
});

/* ---------------- overlay close ---------------- */
function closeOverlays(){document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("open"));}
document.querySelectorAll(".overlay").forEach(o=>{
  o.addEventListener("click",e=>{ if(e.target===o||e.target.closest("[data-close]")) closeOverlays(); });
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeOverlays(); });

/* ---------------- toast ---------------- */
let toastT=null;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2200);}
